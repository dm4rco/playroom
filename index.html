<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDH Deck Viewer</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="playtest-btn" class="btn btn--primary playtest-btn hidden">▶ Playtest</button>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <button id="sidebar-toggle" class="sidebar__toggle" title="Collapse sidebar">‹</button>
      <div class="sidebar__header">
        <h1>EDH Decks</h1>
        <button id="new-deck-btn" class="btn btn--primary">
          <span class="btn-icon">+</span><span class="btn-label"> New Deck</span>
        </button>
      </div>
      <ul id="deck-list" class="deck-list"></ul>
    </aside>

    <main class="content">
      <div id="import-panel" class="import-panel hidden">
        <h2 id="import-title">Import Decklist</h2>

        <div class="import-panel__source">
          <input id="archidekt-url" type="text" placeholder="https://archidekt.com/decks/25521882/vihaan_goldwaker">
          <button id="archidekt-fetch-btn" class="btn">Fetch from Archidekt</button>
        </div>
        <div class="import-panel__or">or paste a decklist below</div>

        <p class="hint">Format:<br>
          <code>1x Card Name (set) 123 *F* [Category]</code></p>
        <input id="import-name" type="text" placeholder="Deck name (auto-detected from commander if left blank)">
        <textarea id="import-text" rows="16" placeholder="1x Aang's Defense (tle) 211 *F* [Draw]&#10;1x Blood Crypt (trk) 278 [Land]&#10;..."></textarea>
        <div class="import-panel__actions">
          <button id="import-submit" class="btn btn--primary">Import</button>
          <button id="import-cancel" class="btn">Cancel</button>
          <span id="import-status" class="import-status"></span>
        </div>
      </div>

      <div id="empty-state" class="empty-state hidden">
        <h2>No deck selected</h2>
        <p>Click <strong>+ New Deck</strong> to paste a decklist and get started.</p>
      </div>

      <div id="deck-actions" class="deck-actions hidden">
        <button id="edit-btn" class="btn">Edit List</button>
        <button id="refresh-btn" class="btn">Refresh Card Data</button>
        <button id="rename-btn" class="btn">Rename</button>
        <button id="delete-btn" class="btn btn--danger">Delete</button>
      </div>

      <div id="main" class="deck-main hidden"></div>
    </main>
  </div>

  <div id="playtest-overlay" class="playtest-overlay"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
